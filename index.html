<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Challenge · 주사위 챌린지</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-border: #e3e6eb;
    --accent: #0d9488;
    --danger: #dc2626;
    --text: #22272f;
    --btn-text: #f5f7fa;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 48px;
    width: 100%;
    max-width: 680px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    transition: max-width 0.2s;
  }
  .card.expanded {
    max-width: 96vw;
    height: 100%;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  h1 { margin: 0 0 12px; font-size: 2.1rem; }
  .stage-label { color: var(--accent); font-weight: bold; margin-bottom: 28px; font-size: 1.3rem; }

  .dice-row {
    display: flex;
    justify-content: center;
    gap: 56px;
    margin: 32px 0;
    opacity: 0.45;
    filter: grayscale(0.7);
    transition: opacity 0.2s, filter 0.2s;
  }
  .dice-row.ready {
    opacity: 1;
    filter: none;
    cursor: pointer;
  }
  .dice-row.rolling {
    pointer-events: none;
  }
  .dice-pedestal {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .dice-scene {
    width: 250px;
    height: 250px;
    perspective: 1000px;
    border-radius: 22px;
    transition: box-shadow 0.2s;
  }
  .dice-row.ready .dice-pedestal {
    animation: readyFloat 1.6s ease-in-out infinite;
  }
  @keyframes readyFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .dice-row.ready .dice-scene:hover {
    box-shadow: 0 0 0 4px var(--accent);
  }
  .dice-shadow {
    width: 176px;
    height: 30px;
    margin-top: 15px;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    filter: blur(3px);
    transition: transform 0.4s ease, opacity 0.4s ease;
  }
  .dice-pedestal.bounce .dice-shadow {
    animation: shadowPulse 0.9s ease-out;
  }
  @keyframes shadowPulse {
    0%   { transform: scale(1.15); opacity: 0.32; }  /* impact 1 */
    8%   { transform: scale(0.55); opacity: 0.10; }  /* airborne, peak 1 */
    16%  { transform: scale(1.1);  opacity: 0.30; }  /* impact 2 */
    24%  { transform: scale(0.7);  opacity: 0.14; }  /* airborne, peak 2 */
    32%  { transform: scale(1.05); opacity: 0.27; }  /* impact 3 */
    40%  { transform: scale(0.85); opacity: 0.18; }  /* airborne, peak 3 */
    48%, 100% { transform: scale(1); opacity: 0.25; } /* settled */
  }
  .dice-pedestal.bounce .dice-scene {
    animation: diceBounce 0.9s ease-out;
  }
  @keyframes diceBounce {
    0%   { transform: translateY(0)     scale(1, 0.92); }              /* impact 1: squash */
    8%   { transform: translateY(-54px) scale(1.03, 1.03); }           /* bounce 1: biggest */
    16%  { transform: translateY(0)     scale(1.04, 0.95); }           /* impact 2: squash, smaller */
    24%  { transform: translateY(-27px) scale(1.015, 1.015); }         /* bounce 2: ~half of bounce 1 */
    32%  { transform: translateY(0)     scale(1.02, 0.97); }           /* impact 3: squash, tiny */
    40%  { transform: translateY(-13px) scale(1.007, 1.007) rotate(0deg); } /* bounce 3: small */
    48%  { transform: translateY(0)     scale(1) rotate(0deg); }       /* settled, micro-jitter starts */
    58%  { transform: translateY(-1px)  scale(1) rotate(1.4deg); }
    66%  { transform: translateY(0)     scale(1) rotate(-1.1deg); }
    74%  { transform: translateY(-0.6px) scale(1) rotate(0.7deg); }
    82%  { transform: translateY(0)     scale(1) rotate(-0.4deg); }
    90%  { transform: translateY(-0.3px) scale(1) rotate(0.2deg); }
    100% { transform: translateY(0)     scale(1) rotate(0deg); }
  }
  .dice-cube {
    position: relative;
    width: 250px;
    height: 250px;
    transform-style: preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .face {
    position: absolute;
    width: 250px;
    height: 250px;
    left: 0;
    top: 0;
    background: #ffffff;
    border-radius: 34px;
    box-shadow: inset 0 0 0 3px #1c1f26, 0 6px 14px rgba(0,0,0,0.35);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 30px;
  }
  .pip {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #1c1f26;
    justify-self: center;
    align-self: center;
    opacity: 0;
  }
  .face-1 .pip:nth-child(5) { background: #dc2626; }
  /* physical layout: opposite faces sum to 7 */
  .face-1 { transform: translateZ(125px); }
  .face-6 { transform: rotateY(180deg) translateZ(125px); }
  .face-2 { transform: rotateY(90deg) translateZ(125px); }
  .face-5 { transform: rotateY(-90deg) translateZ(125px); }
  .face-3 { transform: rotateX(-90deg) translateZ(125px); }
  .face-4 { transform: rotateX(90deg) translateZ(125px); }

  .face-1 .pip:nth-child(5) { opacity: 1; }
  .face-2 .pip:nth-child(1), .face-2 .pip:nth-child(9) { opacity: 1; }
  .face-3 .pip:nth-child(1), .face-3 .pip:nth-child(5), .face-3 .pip:nth-child(9) { opacity: 1; }
  .face-4 .pip:nth-child(1), .face-4 .pip:nth-child(3), .face-4 .pip:nth-child(7), .face-4 .pip:nth-child(9) { opacity: 1; }
  .face-5 .pip:nth-child(1), .face-5 .pip:nth-child(3), .face-5 .pip:nth-child(5), .face-5 .pip:nth-child(7), .face-5 .pip:nth-child(9) { opacity: 1; }
  .face-6 .pip:nth-child(1), .face-6 .pip:nth-child(3), .face-6 .pip:nth-child(4), .face-6 .pip:nth-child(6), .face-6 .pip:nth-child(7), .face-6 .pip:nth-child(9) { opacity: 1; }

  .sum-label { margin: 20px 0 6px; opacity: 0.8; min-height: 1.2em; font-size: 1.15rem; }
  #sumLabel.intro { margin-top: 60px; }

  .guess-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 20px;
  }

  button {
    padding: 20px 0;
    font-size: 1.4rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .guess-btn {
    width: 130px;
    padding: 12px 0;
    font-size: 1rem;
    background: #3a4358;
    color: var(--btn-text);
    box-shadow: inset 0 0 0 2px transparent;
  }
  .guess-btn.selected { box-shadow: inset 0 0 0 3px var(--accent); }
  #btnOdd.selected { background: var(--accent); color: #10312e; }
  #btnEven.selected { background: #f4a261; color: #3a2100; }

  #restartBtn {
    flex: 0 0 auto;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    width: 100%;
    max-width: 220px;
    padding: 10px 0;
    font-size: 0.95rem;
    margin: 0 0 16px;
  }
  #overArea:not(.hidden) {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .result-img {
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    object-fit: contain;
    border-radius: 0;
    margin: 0;
    box-shadow: none;
  }
  .message {
    font-size: 1.5rem;
    font-weight: bold;
    min-height: 1.4em;
    margin-bottom: 12px;
  }
  .message.win { color: var(--accent); }
  .message.lose { color: var(--danger); }
  .win-img {
    width: 72px;
    height: 72px;
    object-fit: contain;
    border-radius: 12px;
    margin: 0 auto 12px;
    display: block;
  }
  #overMessage {
    flex: 0 0 auto;
    font-size: 0.95rem;
    min-height: auto;
    margin: 16px 0 0;
    padding: 8px 22px;
    white-space: nowrap;
    border-radius: 999px;
  }
  #overMessage.lose { background: rgba(220, 38, 38, 0.92); color: #ffffff; }
  #overMessage.win  { background: rgba(13, 148, 136, 0.92); color: #ffffff; }
  .hidden { display: none; }
  .invisible { visibility: hidden; }
  .kr {
    display: inline-block;
    font-size: 1em;
    font-weight: 500;
    opacity: 0.65;
    margin-left: 8px;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">🎲 Dice Challenge <span class="kr">주사위 챌린지</span></h1>
    <div class="stage-label" id="stageLabel">Stage 1 / 10 <span class="kr">스테이지 1 / 10</span></div>

    <div id="gameArea">
      <div class="dice-row" id="diceRow">
        <div class="dice-pedestal" id="pedestal1">
          <div class="dice-scene">
            <div class="dice-cube" id="cube1">
              <div class="face face-1"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-2"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-3"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            </div>
          </div>
          <div class="dice-shadow"></div>
        </div>
        <div class="dice-pedestal" id="pedestal2">
          <div class="dice-scene">
            <div class="dice-cube" id="cube2">
              <div class="face face-1"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-2"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-3"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
              <div class="face face-6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            </div>
          </div>
          <div class="dice-shadow"></div>
        </div>
      </div>

      <div class="sum-label intro" id="sumLabel">Pick Odd or Even, then click the dice to roll <span class="kr">홀수 또는 짝수를 고른 후 주사위를 클릭해서 굴리세요</span></div>
      <div class="message" id="message"></div>
      <img id="winImg" class="win-img invisible" src="a.jpg" alt="Correct">

      <div class="guess-row">
        <button id="btnOdd" class="guess-btn">ODD <span class="kr">홀수</span></button>
        <button id="btnEven" class="guess-btn">EVEN <span class="kr">짝수</span></button>
      </div>
    </div>

    <div id="overArea" class="hidden">
      <div class="message" id="overMessage"></div>
      <img id="overImg" class="result-img" src="" alt="Stage result">
      <button id="restartBtn" class="hidden">Play Again <span class="kr">다시 하기</span></button>
    </div>
  </div>

<script>
  const TOTAL_STAGES = 10;
  let stage = 1;
  let locked = false;
  let selectedGuess = null;

  const ROTATIONS = {
    1: { x: 0,   y: 0   },
    2: { x: 0,   y: -90 },
    3: { x: 90,  y: 0   },
    4: { x: -90, y: 0   },
    5: { x: 0,   y: 90  },
    6: { x: 0,   y: 180 },
  };

  const cubeState1 = { x: 0, y: 0 };
  const cubeState2 = { x: 0, y: 0 };
  const WIN_LETTERS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm'];
  const LOSE_IMG_COUNT = 21;

  [
    ...WIN_LETTERS.map(l => `${l}.jpg`),
    ...Array.from({ length: LOSE_IMG_COUNT }, (_, i) => `${i + 1}.jpg`),
  ].forEach(src => { new Image().src = src; });

  const card = document.getElementById('card');
  const title = document.getElementById('title');
  const stageLabel = document.getElementById('stageLabel');
  const cube1 = document.getElementById('cube1');
  const cube2 = document.getElementById('cube2');
  const pedestal1 = document.getElementById('pedestal1');
  const pedestal2 = document.getElementById('pedestal2');
  const sumLabel = document.getElementById('sumLabel');
  const message = document.getElementById('message');
  const btnOdd = document.getElementById('btnOdd');
  const btnEven = document.getElementById('btnEven');
  const diceRow = document.getElementById('diceRow');
  const gameArea = document.getElementById('gameArea');
  const overArea = document.getElementById('overArea');
  const overMessage = document.getElementById('overMessage');
  const overImg = document.getElementById('overImg');
  const restartBtn = document.getElementById('restartBtn');
  const winImg = document.getElementById('winImg');

  function rollDie() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function updateStageLabel() {
    stageLabel.innerHTML = `Stage ${stage} / ${TOTAL_STAGES} <span class="kr">스테이지 ${stage} / ${TOTAL_STAGES}</span>`;
  }

  function normalize(deg) {
    return ((deg % 360) + 360) % 360;
  }

  function spinCubeTo(cubeEl, state, targetNumber) {
    const target = ROTATIONS[targetNumber];
    state.x += 360 * (2 + Math.floor(Math.random() * 2));
    state.y += 360 * (2 + Math.floor(Math.random() * 2));
    state.x += normalize(target.x) - normalize(state.x);
    state.y += normalize(target.y) - normalize(state.y);
    cubeEl.style.transform = `rotateX(${state.x}deg) rotateY(${state.y}deg)`;
  }

  function selectGuess(guess) {
    if (locked) return;
    selectedGuess = guess;
    btnOdd.classList.toggle('selected', guess === 'odd');
    btnEven.classList.toggle('selected', guess === 'even');
    diceRow.classList.add('ready');
  }

  function rollDice() {
    if (locked || !selectedGuess) return;
    locked = true;
    btnOdd.disabled = true;
    btnEven.disabled = true;
    diceRow.classList.remove('ready');
    diceRow.classList.add('rolling');
    pedestal1.classList.remove('bounce');
    pedestal2.classList.remove('bounce');
    message.textContent = '';
    message.className = 'message';
    winImg.classList.add('invisible');
    sumLabel.classList.remove('intro');
    sumLabel.innerHTML = 'Rolling... <span class="kr">굴리는 중...</span>';

    const a = rollDie();
    const b = rollDie();
    spinCubeTo(cube1, cubeState1, a);
    spinCubeTo(cube2, cubeState2, b);

    setTimeout(() => {
      pedestal1.classList.add('bounce');
      pedestal2.classList.add('bounce');
      const sum = a + b;
      const isOdd = sum % 2 === 1;
      const result = isOdd ? 'odd' : 'even';
      const win = result === selectedGuess;

      sumLabel.innerHTML = `Sum this round: ${sum} (${isOdd ? 'Odd' : 'Even'}) <span class="kr">이번 라운드 합계: ${sum} (${isOdd ? '홀수' : '짝수'})</span>`;

      if (win) {
        message.innerHTML = 'Correct! Stage cleared! <span class="kr">정답! 스테이지 클리어!</span>';
        message.classList.add('win');
        const winLetter = WIN_LETTERS[Math.floor(Math.random() * WIN_LETTERS.length)];
        winImg.src = `${winLetter}.jpg`;
        winImg.classList.remove('invisible');
        setTimeout(() => {
          if (stage >= TOTAL_STAGES) {
            showFinalWin();
          } else {
            stage += 1;
            updateStageLabel();
            resetRoundControls();
          }
        }, 3000);
      } else {
        message.innerHTML = 'Wrong guess. Game over! <span class="kr">틀렸습니다. 게임 종료!</span>';
        message.classList.add('lose');
        setTimeout(() => showLose(stage), 1000);
      }
    }, 1100);
  }

  function resetRoundControls() {
    selectedGuess = null;
    btnOdd.classList.remove('selected');
    btnEven.classList.remove('selected');
    btnOdd.disabled = false;
    btnEven.disabled = false;
    diceRow.classList.remove('ready', 'rolling');
    sumLabel.classList.add('intro');
    sumLabel.innerHTML = 'Pick Odd or Even, then click the dice to roll <span class="kr">홀수 또는 짝수를 고른 후 주사위를 클릭해서 굴리세요</span>';
    message.textContent = '';
    winImg.classList.add('invisible');
    locked = false;
  }

  function showLose(lostAtStage) {
    title.classList.add('hidden');
    stageLabel.classList.add('hidden');
    gameArea.classList.add('hidden');
    overArea.classList.remove('hidden');
    restartBtn.classList.remove('hidden');
    card.classList.add('expanded');
    overMessage.innerHTML = `You lost at Stage ${lostAtStage}  ! <span class="kr">스테이지 ${lostAtStage}에서 패배했습니다  !</span>`;
    overMessage.className = 'message lose';
    const randomImg = Math.floor(Math.random() * LOSE_IMG_COUNT) + 1;
    overImg.src = `${randomImg}.jpg`;
    overImg.classList.remove('hidden');
  }

  function showFinalWin() {
    title.classList.add('hidden');
    stageLabel.classList.add('hidden');
    gameArea.classList.add('hidden');
    overArea.classList.remove('hidden');
    restartBtn.classList.remove('hidden');
    card.classList.add('expanded');
    overMessage.innerHTML = `Congratulations! You cleared all ${TOTAL_STAGES} stages! <span class="kr">축하합니다! ${TOTAL_STAGES}개 스테이지를 모두 클리어했습니다!</span>`;
    overMessage.className = 'message win';
    overImg.classList.add('hidden');
  }

  function restart() {
    stage = 1;
    updateStageLabel();
    resetRoundControls();
    title.classList.remove('hidden');
    stageLabel.classList.remove('hidden');
    gameArea.classList.remove('hidden');
    overArea.classList.add('hidden');
    restartBtn.classList.add('hidden');
    card.classList.remove('expanded');
  }

  btnOdd.addEventListener('click', () => selectGuess('odd'));
  btnEven.addEventListener('click', () => selectGuess('even'));
  diceRow.addEventListener('click', rollDice);
  restartBtn.addEventListener('click', restart);

  updateStageLabel();
</script>
</body>
</html>
