<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주사위 홀짝게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout" id="layout">
  <div class="card" id="card">
    <img class="bg-girl dice" src="girl-dice.png" alt="">
    <img class="bg-girl cheer" src="girl-cheer.png" alt="">
    <img class="bg-girl bite" src="girl-bite.png" alt="">
    <div class="hand-die" id="handDie" aria-hidden="true"></div>
    <h1 id="title">🎲 주사위 홀짝게임 <span class="en">Dice Odd · Even</span></h1>
    <div class="stage-label" id="stageLabel">스테이지 1 / 10</div>

    <div id="gameArea">
      <div class="dice-row" id="diceRow" role="button" tabindex="0" aria-label="주사위 굴리기 Roll the dice">
        <!-- dice faces are built by buildDie() in the script -->
        <div class="dice-pedestal" id="pedestal1"></div>
        <div class="dice-pedestal" id="pedestal2"></div>
      </div>

      <div class="sum-label" id="sumLabel"></div>
      <div class="message" id="message"></div>
      <img id="winImg" class="win-img invisible" alt="Correct">
      <button id="cashOutBtn" class="cash-out hidden" type="button"></button>

      <div class="guess-row">
        <button id="btnOdd" class="guess-btn">홀수 <span class="en">ODD</span></button>
        <button id="btnEven" class="guess-btn">짝수 <span class="en">EVEN</span></button>
      </div>
    </div>
  </div>

  <aside class="ladder" id="ladder">
    <div class="ladder-head">
      <button class="edit-btn" id="editBtn" type="button" title="선물 편집 · Edit prizes">⚙️ 편집</button>
      <div class="ladder-title">👑 선물 목록</div>
      <div class="ladder-ribbon">운을 굴려 ❤ 선물을 GET!</div>
    </div>
    <ol class="prize-list" id="prizeList"></ol>
    <section class="roll-log">
      <div class="roll-log-title">🎲 굴림 기록 <span class="en">Roll log</span></div>
      <ol class="roll-log-list" id="rollLogList"></ol>
    </section>
  </aside>
  </div>

  <dialog class="editor" id="editor">
    <form method="dialog" id="editorForm">
      <div class="editor-head">
        <h2>🎁 선물 편집 <span class="en">Edit prizes</span></h2>
        <p>각 승수의 선물 이름과 아이콘을 입력하세요. 아이콘은 이모지를 쓰거나 이미지를 올릴 수 있어요.
          <span class="en">Enter a name and icon for each win count. Use an emoji or upload an image.</span></p>
        <div class="game-settings">
          <label>🎯 스테이지 수 <span class="en">Stages</span> <select id="setStages"></select></label>
          <label>🔥 긴장감 <span class="en">Tension</span> <select id="setTense"></select></label>
          <span class="set-odds" id="setOdds"></span>
        </div>
        <div class="emoji-palette" id="emojiPalette" title="클릭하면 선택한 칸에 들어가요"></div>
      </div>
      <div class="editor-rows" id="editorRows"></div>
      <div class="editor-foot">
        <button type="button" class="ed-btn ghost" id="resetPrizes">기본값 복원 <span class="en">Reset</span></button>
        <span class="editor-note" id="editorNote"></span>
        <button type="button" class="ed-btn ghost" id="cancelEdit">취소 <span class="en">Cancel</span></button>
        <button type="submit" class="ed-btn primary" id="savePrizes">저장 <span class="en">Save</span></button>
      </div>
    </form>
    <div class="color-pop" id="colorPop" hidden>
      <div class="cp-presets" id="cpPresets"></div>
      <div class="cp-grid" id="cpGrid"></div>
      <div class="cp-shade-row">
        <span>어둡게</span>
        <input type="range" class="ed-shade" id="cpShade" step="1" title="어둡게 ◀ ▶ 밝게 (더블클릭: 원래 색)" aria-label="색 밝기 Lightness">
        <span>밝게</span>
      </div>
      <div class="cp-foot">
        <span class="cp-preview"></span>
        <span class="cp-hex" id="cpHex"></span>
        <button type="button" class="ed-btn ghost cp-more" id="cpMore">기타 색상…</button>
        <input type="color" class="cp-native" id="cpNative" tabindex="-1">
      </div>
    </div>
  </dialog>

  <div class="tension-veil" id="tensionVeil"></div>

  <div id="overArea" class="hidden">
   <div class="over-stage" id="overStage">
    <div class="message" id="overMessage"></div>
    <img id="overImg" class="result-img" src="" alt="Stage result">
    <div class="final-area hidden" id="finalArea">
      <div class="grand-card" id="grandCard">
        <div class="grand-crown">👑</div>
        <div class="grand-wins" id="grandWins"></div>
        <div class="grand-prize" id="grandPrize"></div>
        <div class="grand-heart" id="grandIcon"></div>
      </div>
      <div class="win-gallery" id="winGallery"></div>
    </div>
    <div class="over-foot">
      <div class="earned" id="earned"></div>
      <button id="restartBtn">다시 하기 <span class="en">Play Again</span></button>
    </div>
   </div>
  </div>

<script src="app.js"></script>
</body>
</html>
